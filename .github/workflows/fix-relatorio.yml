name: Corrigir relatório

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar relatório e validação
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')

          old='''<p><b>Observações:</b> {{s.notes or '-'}}''' 
          new='''<p><b>O que foi feito:</b> {{s.work_done or '-'}}</p><p><b>Observação da finalização:</b> {{s.notes or '-'}}'''
          s=s.replace(old,new,1)

          old='''<div class="field"><label>OBSERVAÇÕES FINAIS</label><textarea name="notes" rows="5"></textarea></div><button class="btn full">✓ Finalizar serviço</button>'''
          new='''<div class="field"><label>O QUE FOI FEITO</label><textarea name="work_done" rows="5" placeholder="Descreva o serviço realizado..." required></textarea></div><div class="field"><label>OBSERVAÇÃO DA FINALIZAÇÃO</label><textarea name="notes" rows="5" placeholder="Observações finais..."></textarea></div><button class="btn full">✓ Finalizar serviço</button>'''
          s=s.replace(old,new,1)

          old="<tr><th>OS</th><th>Produto</th><th>Responsável</th><th>Prioridade</th><th>Início</th><th>Finalização</th><th>Status</th></tr>"
          new="<tr><th>OS</th><th>Cliente</th><th>Produto</th><th>Responsável</th><th>Prioridade</th><th>O que foi feito</th><th>Observação</th><th>Início</th><th>Finalização</th><th>Status</th></tr>"
          s=s.replace(old,new,1)

          old="<tr><td>OS-{{'%05d'%s.id}}</td><td>{{s.product_id}}</td><td>{% for u in users if u.id==s.responsible_id %}{{u.name}}{% endfor %}</td><td>{{priority_for(s)}}</td><td>{{s.started_at.strftime('%d/%m/%Y %H:%M') if s.started_at else '-'}}</td><td>{{s.finished_at.strftime('%d/%m/%Y %H:%M') if s.finished_at else '-'}}</td><td>{{s.status}}</td></tr>"
          new="<tr><td>OS-{{'%05d'%s.id}}</td><td>{{s.client or '-'}}</td><td>{% for p in products if p.id==s.product_id %}{{p.name}}{% endfor %}</td><td>{% for u in users if u.id==s.responsible_id %}{{u.name}}{% endfor %}</td><td>{{priority_for(s)}}</td><td>{{s.work_done or '-'}}</td><td>{{s.notes or '-'}}</td><td>{{s.started_at.strftime('%d/%m/%Y %H:%M') if s.started_at else '-'}}</td><td>{{s.finished_at.strftime('%d/%m/%Y %H:%M') if s.finished_at else '-'}}</td><td>{{s.status}}</td></tr>"
          s=s.replace(old,new,1)
          s=s.replace("services=q.order_by(Service.created_at.desc()).all();users=d.query(User).order_by(User.name).all()","services=q.order_by(Service.created_at.desc()).all();users=d.query(User).order_by(User.name).all();products=d.query(Product).order_by(Product.name).all()",1)
          s=s.replace("services=services,users=users,priority_for=priority_for)","services=services,users=users,products=products,priority_for=priority_for)",1)

          s=s.replace("w.writerow([f'OS-{s.id:05d}',p.name if p else '',p.code if p else '',p.sector if p else '',priority_for(s),s.status,u.name if u else '',s.created_at.strftime('%d/%m/%Y %H:%M'),s.started_at.strftime('%d/%m/%Y %H:%M') if s.started_at else '',s.finished_at.strftime('%d/%m/%Y %H:%M') if s.finished_at else '',s.notes])","w.writerow([f'OS-{s.id:05d}',s.client,p.name if p else 'Sem produto',p.code if p else '',priority_for(s),s.status,u.name if u else '',s.created_at.strftime('%d/%m/%Y %H:%M'),s.started_at.strftime('%d/%m/%Y %H:%M') if s.started_at else '',s.finished_at.strftime('%d/%m/%Y %H:%M') if s.finished_at else '',s.work_done,s.notes])",1)
          s=s.replace("['OS','Produto','Patrimônio','Setor','Prioridade','Status','Responsável','Entrada','Início','Finalização','Observações']","['OS','Cliente','Produto','Patrimônio','Prioridade','Status','Responsável','Entrada','Início','Finalização','O que foi feito','Observação da finalização']",2)
          s=s.replace("ws.append([f'OS-{s.id:05d}',p.name if p else '',p.code if p else '',p.sector if p else '',priority_for(s),s.status,u.name if u else '',s.created_at.strftime('%d/%m/%Y %H:%M'),s.started_at.strftime('%d/%m/%Y %H:%M') if s.started_at else '',s.finished_at.strftime('%d/%m/%Y %H:%M') if s.finished_at else '',s.notes])","ws.append([f'OS-{s.id:05d}',s.client,p.name if p else 'Sem produto',p.code if p else '',priority_for(s),s.status,u.name if u else '',s.created_at.strftime('%d/%m/%Y %H:%M'),s.started_at.strftime('%d/%m/%Y %H:%M') if s.started_at else '',s.finished_at.strftime('%d/%m/%Y %H:%M') if s.finished_at else '',s.work_done,s.notes])",1)

          s=s.replace("c.drawString(40,y,f'OS-{s.id:05d} | {p.name if p else \"-\"} | {priority_for(s)} | {s.status}');y-=14;c.drawString(55,y,f'Entrada: {s.created_at.strftime(\"%d/%m/%Y %H:%M\")} | Início: {s.started_at.strftime(\"%d/%m/%Y %H:%M\") if s.started_at else \"-\"} | Final: {s.finished_at.strftime(\"%d/%m/%Y %H:%M\") if s.finished_at else \"-\"}');y-=18","c.drawString(40,y,f'OS-{s.id:05d} | Cliente: {s.client or \"-\"} | Produto: {p.name if p else \"Sem produto\"}');y-=14;c.drawString(55,y,f'O que foi feito: {s.work_done or \"-\"}');y-=14;c.drawString(55,y,f'Observação: {s.notes or \"-\"}');y-=14;c.drawString(55,y,f'Status: {s.status} | Prioridade: {priority_for(s)} | Final: {s.finished_at.strftime(\"%d/%m/%Y %H:%M\") if s.finished_at else \"-\"}');y-=18",1)

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Publicar e remover workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-relatorio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py .github/workflows/fix-relatorio.yml
          git commit -m 'feat: relatório com cliente produto e observação final' || exit 0
          git push

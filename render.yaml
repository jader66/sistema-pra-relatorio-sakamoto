services:
  - type: web
    name: sistema-manutencao-sakamoto
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap_admin.py && gunicorn app:app
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sakamoto-db
          property: connectionString
      - key: ADMIN_NAME
        value: Jader
      - key: ADMIN_USERNAME
        value: jader
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: sakamoto-db
    databaseName: sakamoto
    user: sakamoto
    plan: free

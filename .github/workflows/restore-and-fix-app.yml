name: Restaurar e corrigir aplicação

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar app completo da versão funcional
        run: git checkout d12c44b73c80fbdce7dec4abbcf09cd62bebdf8f -- app.py

      - name: Corrigir banco e relatório
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('app.py')
          source = path.read_text(encoding='utf-8')

          source = re.sub(r"\n    with SessionLocal\(\) as d:\n        # Migra ordens antigas.*?\n            d\.rollback\(\)\n", "\n", source, flags=re.S)
          source = re.sub(r"\n    with SessionLocal\(\) as d:\n        try:\n            legacy_col=.*?\n            d\.rollback\(\)\n", "\n", source, flags=re.S)
          source = re.sub(r"\n@app\.before_request\ndef startup\(\):\n    try:init_db\(\)\n    except Exception:pass\n", "\n", source)

          marker = "\ndef db(): return SessionLocal()\n"
          boot = "\n# Schema inicializado uma vez por worker, nunca por requisição.\ntry:\n    init_db()\nexcept Exception:\n    app.logger.exception('Database initialization failed during startup')\n\n"
          if 'Schema inicializado uma vez por worker' not in source:
              source = source.replace(marker, boot + "def db(): return SessionLocal()\n", 1)

          service_line = "id:Mapped[int]=mapped_column(primary_key=True); product_id:Mapped[int|None]=mapped_column(ForeignKey('products.id'),nullable=True); client:Mapped[str]=mapped_column(String(160),default=''); problem:Mapped[str]=mapped_column(Text,default=''); priority:Mapped[str]=mapped_column(String(30),default='Normal'); status:Mapped[str]=mapped_column(String(30),default='Pendente'); responsible_id:Mapped[int|None]=mapped_column(ForeignKey('users.id'),nullable=True); created_by:Mapped[int]=mapped_column(ForeignKey('users.id')); created_at:Mapped[datetime]=mapped_column(DateTime,default=datetime.utcnow); started_at:Mapped[datetime|None]=mapped_column(DateTime,nullable=True); finished_at:Mapped[datetime|None]=mapped_column(DateTime,nullable=True); notes:Mapped[str]=mapped_column(Text,default='')"
          if 'work_done:Mapped[str]' not in source and service_line in source:
              source = source.replace(service_line, service_line[:-len("; notes:Mapped[str]=mapped_column(Text,default='')")] + "; work_done:Mapped[str]=mapped_column(Text,default=''); notes:Mapped[str]=mapped_column(Text,default='')", 1)
          source = source.replace("if 'product_id' not in scols: c.execute(text(\"ALTER TABLE services ADD COLUMN product_id INTEGER\"))", "if 'product_id' not in scols: c.execute(text(\"ALTER TABLE services ADD COLUMN product_id INTEGER\"))\n            if 'work_done' not in scols: c.execute(text(\"ALTER TABLE services ADD COLUMN work_done TEXT DEFAULT ''\"))", 1)
          source = source.replace("c.execute(text(\"ALTER TABLE services ADD COLUMN IF NOT EXISTS product_id INTEGER\"))", "c.execute(text(\"ALTER TABLE services ADD COLUMN IF NOT EXISTS product_id INTEGER\"))\n            c.execute(text(\"ALTER TABLE services ADD COLUMN IF NOT EXISTS work_done TEXT DEFAULT ''\"))", 1)
          source = source.replace("s.finished_at=datetime.utcnow();s.status='Finalizado';s.notes=request.form.get('notes','');", "s.finished_at=datetime.utcnow();s.status='Finalizado';s.work_done=request.form.get('work_done','').strip();s.notes=request.form.get('notes','').strip();", 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validar código e rotas
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path('app.py').read_text(encoding='utf-8')
          routes = set(re.findall(r"@app\.(?:get|post|route)\(['\"]([^'\"]+)", source))
          required = {'/dashboard','/servicos','/produtos','/relatorios'}
          missing = required - routes
          if missing:
              raise SystemExit(f'Rotas ausentes: {sorted(missing)}')
          if 'SELECT id, product FROM services' in source:
              raise SystemExit('Migração legada services.product ainda presente')
          if '@app.before_request\ndef startup' in source:
              raise SystemExit('Inicialização por requisição ainda presente')
          print('Código validado:', sorted(required))
          PY

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-and-fix-app.yml
          git add app.py .github/workflows/restore-and-fix-app.yml
          git commit -m "fix: restaurar dashboard e corrigir banco"
          git push

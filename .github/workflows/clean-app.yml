name: Corrigir arquitetura do app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir init_db e inicializacao
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.py')
          s = path.read_text(encoding='utf-8')

          # Remove the obsolete migration that queried a non-existent legacy
          # services.product column. product_id is the canonical field now.
          s = re.sub(
              r"\n    with SessionLocal\(\) as d:\n        try:\n            rows=d\.execute\(text\(\"SELECT id, product FROM services.*?\n            d\.rollback\(\)\n",
              "\n",
              s,
              flags=re.S,
          )

          # Database initialization belongs to Gunicorn startup, not request handling.
          s = re.sub(
              r"\n# Keep the health endpoint independent.*?\n@app\.before_request\ndef ensure_database\(\):.*?\n    return None\n",
              "\n@app.get('/status')\ndef status():\n    return {'status': 'ok', 'service': 'sistema-manutencao-sakamoto'}, 200\n",
              s,
              flags=re.S,
          )

          # Avoid duplicated status endpoint if the replacement found the old block.
          matches = list(re.finditer(r"@app\.get\('/status'\)", s))
          if len(matches) > 1:
              first = matches[0]
              second = matches[1]
              end = s.find("\n\n", second.start())
              if end != -1:
                  s = s[:second.start()] + s[end+2:]

          path.write_text(s, encoding='utf-8')
          PY

      - name: Validar Python
        run: python -m py_compile app.py gunicorn.conf.py

      - name: Publicar e remover workflow temporario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/clean-app.yml
          git add app.py gunicorn.conf.py .github/workflows/clean-app.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: limpar inicializacao e migracao do banco"
          git push

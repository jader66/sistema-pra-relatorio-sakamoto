name: Fix database initialization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          source = path.read_text(encoding='utf-8')

          start = source.index('def init_db():')
          end = source.index('\ndef db():', start)
          init_db = '''def init_db():
    """Create the current schema once when the worker starts.

    Database initialization must not run on every HTTP request because
    PostgreSQL ALTER TABLE operations can wait on locks and cause timeouts.
    """
    Base.metadata.create_all(engine)
    with engine.begin() as c:
        if engine.dialect.name == 'sqlite':
            pcols = {r[1] for r in c.execute(text('PRAGMA table_info(products)')).fetchall()}
            scols = {r[1] for r in c.execute(text('PRAGMA table_info(services)')).fetchall()}
            if 'priority' not in pcols:
                c.execute(text("ALTER TABLE products ADD COLUMN priority VARCHAR(30) DEFAULT 'Normal'"))
            if 'product_id' not in scols:
                c.execute(text("ALTER TABLE services ADD COLUMN product_id INTEGER"))
        else:
            c.execute(text("ALTER TABLE products ADD COLUMN IF NOT EXISTS priority VARCHAR(30) DEFAULT 'Normal'"))
            c.execute(text("ALTER TABLE services ADD COLUMN IF NOT EXISTS product_id INTEGER"))

'''
          source = source[:start] + init_db + source[end + 1:]

          old = '''@app.before_request
def startup():
    try:init_db()
    except Exception:pass
'''
          if old not in source:
              raise SystemExit('startup block not found')

          new = '''# Initialize the database once when each Gunicorn worker starts.
# Never run schema migrations from before_request.
try:
    init_db()
except Exception:
    app.logger.exception('Database initialization failed during startup')
'''
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify Python syntax
        run: python -m py_compile app.py

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-db-init.yml
          git add app.py .github/workflows/fix-db-init.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: initialize database once at startup"
          git push
